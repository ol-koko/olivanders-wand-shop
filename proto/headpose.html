<!doctype html>
<!-- Prototype: answering the Hat with the head. Branch preview only, never merged to main. The camera picture stays in this page. Nothing is recorded or sent, and the model only gives the head's angle. -->
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Прототип: голова</title>
<style>
body{margin:0;min-height:100vh;display:flex;justify-content:center;background:radial-gradient(70% 60% at 50% 30%,#3a2c28,#0c0c16);color:#f3e6c8;font:18px Georgia,serif}
main{width:min(94vw,560px);padding:18px 0;text-align:center}
#cam{width:190px;height:142px;object-fit:cover;transform:scaleX(-1);border:2px solid #d9b46a;border-radius:10px;background:#000}
h1{font-size:26px;font-weight:400;color:#d9b46a;margin:12px 0}
#opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#opts div{padding:18px 4px;border:1px solid #7a5428;border-radius:14px;transition:background .12s,transform .12s}
#opts .aim{background:rgba(217,180,106,.35);border-color:#d9b46a;transform:scale(1.05)}
#opts .pick{background:#d9b46a;color:#2a170b}
#st{min-height:26px;margin:14px 0;color:#d9b46a}
button{font:inherit;background:#2b1a0e;color:#e8cf97;border:1px solid #7a5428;border-radius:999px;padding:8px 16px;margin:4px;cursor:pointer}
button.on{background:#d9b46a;color:#2a170b}
#num{font:13px monospace;color:#a9987a;margin-top:10px}
</style>
<main>
  <video id="cam" playsinline muted></video>
  <h1>Куди б ти пішов уночі?</h1>
  <div id="opts"><div>До бібліотеки</div><div>На дах</div><div>До кухні</div><div>Спати</div></div>
  <div id="st">Натисни «Увімкнути камеру»</div>
  <button id="go">Увімкнути камеру</button><button id="again" hidden>Дивлюсь прямо, скинути</button><br>
  <button id="roll" class="on">Нахил</button><button id="yaw">Поворот</button><button id="flip">Поміняти напрямок</button>
  <div id="num"></div>
</main>
<script src="/proto/headpose.js"></script>
<script type="module">
const VER = '0.10.14', MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const $ = s => document.querySelector(s), opts = [...document.querySelectorAll('#opts div')], st = s => { $('#st').textContent = s; };
const P = { mode: 'roll', flip: 1, face: null, stream: null, zero: null, samples: null, tracker: HeadPose.createTracker({ range: 20 }), last: 0, run: false, lost: 0 };
window.__proto = P;
function mode(m) { P.mode = m; $('#roll').classList.toggle('on', m === 'roll'); $('#yaw').classList.toggle('on', m === 'yaw'); P.tracker = HeadPose.createTracker({ range: m === 'yaw' ? 24 : 20 }); }
$('#roll').onclick = () => mode('roll'); $('#yaw').onclick = () => mode('yaw'); $('#flip').onclick = () => { P.flip *= -1; P.tracker.reset(); };
function calibrate() { P.zero = null; P.samples = []; P.tracker.reset(); opts.forEach(o => o.classList.remove('aim', 'pick')); st('Подивись прямо на екран…'); }
$('#again').onclick = calibrate;
function stop() { P.run = false; if (P.stream) { P.stream.getTracks().forEach(t => t.stop()); P.stream = null; } $('#cam').srcObject = null; $('#go').hidden = false; $('#again').hidden = true; }
document.addEventListener('visibilitychange', () => { if (document.hidden && P.run) { stop(); st('Камеру вимкнено, бо вкладка прихована'); } });
$('#go').onclick = async () => {
  $('#go').hidden = true; st('Завантажую модель…');
  try {
    if (!P.face) { const v = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}/vision_bundle.mjs`), files = await v.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}/wasm`); P.face = await v.FaceLandmarker.createFromOptions(files, { baseOptions: { modelAssetPath: MODEL, delegate: new URLSearchParams(location.search).get('d') || 'CPU' }, runningMode: 'VIDEO', numFaces: 1, outputFacialTransformationMatrixes: true, outputFaceBlendshapes: false }); }
    st('Дозволь камеру…'); P.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 }, audio: false }); const c = $('#cam'); c.srcObject = P.stream; await c.play();
    P.run = true; $('#again').hidden = false; calibrate(); requestAnimationFrame(loop);
  } catch (e) { stop(); st('Не вийшло: ' + e.message); }
};
function loop(t) {
  if (!P.run) return; requestAnimationFrame(loop); if (t - P.last < 30) return; P.last = t;
  const r = P.face.detectForVideo($('#cam'), t), m = r.facialTransformationMatrixes && r.facialTransformationMatrixes[0];
  if (!m) { if (++P.lost > 12) st('Не бачу обличчя'); return; } P.lost = 0;
  const a = HeadPose.anglesFrom(m.data);
  if (!P.zero) { P.samples.push(a); if (P.samples.length >= 40) { const avg = k => P.samples.reduce((s, x) => s + x[k], 0) / P.samples.length; P.zero = { roll: avg('roll'), yaw: avg('yaw'), pitch: avg('pitch') }; st('Нахили голову до варіанта й кивни'); } return; }
  const side = (a[P.mode] - P.zero[P.mode]) * P.flip, pitch = a.pitch - P.zero.pitch, u = P.tracker.update(t, { side, pitch });
  opts.forEach((o, i) => o.classList.toggle('aim', i === u.aim));
  if (u.picked !== null) { const o = opts[u.picked]; o.classList.add('pick'); st('Обрано: ' + o.textContent); setTimeout(() => o.classList.remove('pick'), 900); }
  $('#num').textContent = `${P.mode} ${side.toFixed(1)}°  кивок ${pitch.toFixed(1)}°`;
}
window.__ready = true;
</script>
