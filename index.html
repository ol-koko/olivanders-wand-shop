<style>
/* street */
#street{cursor:pointer;touch-action:none;opacity:0;transition:opacity .35s}
#street.ready{opacity:1}
@media (prefers-reduced-motion:reduce){#street{transition:none}}
.leak{animation:leak 3s ease-in-out infinite}
#postHall{cursor:pointer;outline:none}
#postHall .glow{opacity:.18;animation:postGlow 3.4s ease-in-out infinite alternate;transition:opacity .3s}
#postHall:hover .glow{opacity:.55;animation:none}
#postHall .ring{opacity:0}
#postHall:focus-visible .ring{opacity:1}
@keyframes postGlow{to{opacity:.42}}
#post .sw{transform-box:view-box;transform-origin:0 0}
#post .sw.swing{animation:swing .9s ease-out}
@keyframes swing{20%{transform:rotate(-3deg)}45%{transform:rotate(2deg)}70%{transform:rotate(-1deg)}}
@keyframes leak{50%{opacity:.55}}

/* shop */
#shop{opacity:0}
.curtain{position:absolute;top:3.4%;width:clamp(80px,15vw,230px);height:44%;pointer-events:none;transform-origin:50% 0;animation:sway 7s ease-in-out infinite alternate}
.curtain.l{left:3.6%}
.curtain.r{right:3.6%;transform:scaleX(-1);animation-name:swayr}
.curtain svg{width:100%;height:100%;display:block}
@keyframes sway{from{transform:rotate(.5deg) skewX(.4deg)}to{transform:rotate(-.6deg) skewX(-.6deg)}}
@keyframes swayr{from{transform:scaleX(-1) rotate(.5deg) skewX(.4deg)}to{transform:scaleX(-1) rotate(-.6deg) skewX(-.6deg)}}
.wind .curtain{animation-duration:.9s}

.wbox{position:absolute;border-radius:2px;--g:0;background:linear-gradient(180deg,rgba(255,240,210,.22),rgba(0,0,0,0) 45%,rgba(0,0,0,.35)),var(--c);box-shadow:inset 0 0 0 1px rgba(226,190,120,.75),0 2px 4px rgba(0,0,0,.7),0 0 calc(3px + var(--g)*38px) calc(var(--g)*7px) rgba(255,190,100,calc(var(--g)*.95));transition:--g .6s ease}
.wbox .halo{position:absolute;inset:-120% -40%;background:radial-gradient(closest-side,rgba(255,205,120,.5),rgba(255,205,120,0));opacity:calc(var(--g)*1.1);pointer-events:none;mix-blend-mode:screen}
.wbox .lab{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#eadbb6;color:#4a3020;font-family:var(--hand);font-size:clamp(10px,1.3vh,14px);line-height:1.15;padding:0 .45em;border-radius:1px;white-space:nowrap}
.wbox.jig{animation:jigb .12s linear infinite}
@keyframes jigb{50%{transform:translate(1px,-1px)}}

#fx{z-index:5}
#stage{position:absolute;inset:0;z-index:8;touch-action:none;pointer-events:none}
#stage.on{pointer-events:auto;cursor:crosshair}

/* big box */
#bigbox{position:fixed;z-index:12;border-radius:4px;--c:#553;pointer-events:none}
#bigbox .tray{position:absolute;inset:0;border-radius:4px;background:radial-gradient(120% 140% at 50% 40%,#5a2440,#2a0c1c 70%);box-shadow:inset 0 0 0 3px var(--c),inset 0 0 0 4px rgba(226,190,120,.8),inset 0 6px 18px rgba(0,0,0,.7),0 18px 50px rgba(0,0,0,.75)}
#bigbox canvas{position:absolute;left:-10%;width:120%;top:-150%;height:400%;pointer-events:none}
#bigbox .lid{position:absolute;inset:-3px;border-radius:4px;background:linear-gradient(180deg,rgba(255,240,210,.25),rgba(0,0,0,0) 40%,rgba(0,0,0,.35)),var(--c);box-shadow:inset 0 0 0 1px rgba(226,190,120,.85),0 0 40px rgba(255,190,100,.45);display:grid;place-items:center}
#bigbox .lid span{background:#eadbb6;color:#4a3020;font-family:var(--hand);font-size:clamp(14px,3.6vw,20px);padding:.05em .8em;border-radius:2px}

#camBox{position:absolute;z-index:22;top:calc(env(safe-area-inset-top) + 10px);left:calc(env(safe-area-inset-left) + 10px);width:clamp(112px,14vw,170px);aspect-ratio:4/5;filter:drop-shadow(0 8px 14px rgba(0,0,0,.65));transition:filter .4s}
#camBox.seen{filter:drop-shadow(0 8px 14px rgba(0,0,0,.65)) drop-shadow(0 0 12px rgba(255,200,110,.7))}

/* result */
@media (prefers-reduced-motion:reduce){.curtain,#cta,.tw,#postHall .glow,#post .sw.swing{animation:none}}
</style>
