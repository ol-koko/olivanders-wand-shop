<style>
@property --g{syntax:'<number>';inherits:true;initial-value:0}
:root{--gold:#d9b46a;--gold2:#f6e2ae;--ink:#3a2516;--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--hand:'Marck Script','Segoe Script','Bradley Hand',cursive}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;background:#07060a;overflow:hidden;color:#f3e6c8;font-family:var(--serif);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden;background:#07060a}
#app.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,3px) rotate(-.4deg)}40%,60%{transform:translate(7px,-3px) rotate(.4deg)}}
.scene{position:absolute;inset:0;overflow:hidden}
.pl{position:absolute;left:-4%;top:-4%;width:108%;height:108%;will-change:transform;transform-origin:50% 50%}
.pl>svg,.pl>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.full{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}

/* street */
#street{cursor:pointer;touch-action:none}
.st-title{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + min(7vh, 56px));text-align:center;pointer-events:none;transition:opacity .6s,transform .8s;padding:0 18px}
.st-title h1{font-weight:600;font-size:clamp(30px,min(8.6vw,11vh),72px);line-height:1;letter-spacing:.01em;background:linear-gradient(180deg,#fff4d2 10%,#e8c27a 55%,#b4823e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,200,120,.35)) drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.st-title p{margin:min(12px,1.6vh) auto 0;max-width:560px;font-style:italic;font-size:clamp(14px,min(4vw,3.4vh),23px);line-height:1.3;color:#e2d6bd;text-shadow:0 1px 8px rgba(0,0,0,.9)}
#cta{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;bottom:calc(env(safe-area-inset-bottom) + max(5.5vh, 34px));padding:13px 30px;border-radius:999px;background:linear-gradient(180deg,#f4d895,#c99a4e);border:1px solid #fff0c4;color:#2a170b;font:inherit;font-size:clamp(19px,4.6vw,22px);font-weight:700;letter-spacing:.01em;white-space:nowrap;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.55),0 0 26px rgba(255,200,110,.35);animation:ctap 2.6s ease-in-out infinite;transition:opacity .5s}
.st-fan{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 7px);text-align:center;font-style:italic;font-size:12.5px;line-height:1.2;padding:0 12px;font-weight:600;color:#232b45;pointer-events:none;transition:opacity .5s}
@keyframes ctap{50%{box-shadow:0 8px 30px rgba(0,0,0,.55),0 0 44px rgba(255,200,110,.65);transform:translateY(-3px)}}
.tw{animation:tw 2.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.leak{animation:leak 3s ease-in-out infinite}
@keyframes leak{50%{opacity:.55}}

/* shop */
#shop{opacity:0}
.curtain{position:absolute;top:3.4%;width:clamp(80px,15vw,230px);height:44%;pointer-events:none;transform-origin:50% 0;animation:sway 7s ease-in-out infinite alternate}
.curtain.l{left:3.6%}
.curtain.r{right:3.6%;transform:scaleX(-1);animation-name:swayr}
.curtain svg{width:100%;height:100%;display:block}
@keyframes sway{from{transform:rotate(.5deg) skewX(.4deg)}to{transform:rotate(-.6deg) skewX(-.6deg)}}
@keyframes swayr{from{transform:scaleX(-1) rotate(.5deg) skewX(.4deg)}to{transform:scaleX(-1) rotate(-.6deg) skewX(-.6deg)}}
.wind .curtain{animation-duration:.9s}

.wbox{position:absolute;border-radius:2px;--g:0;background:linear-gradient(180deg,rgba(255,240,210,.22),rgba(0,0,0,0) 45%,rgba(0,0,0,.35)),var(--c);box-shadow:inset 0 0 0 1px rgba(226,190,120,.75),0 2px 4px rgba(0,0,0,.7),0 0 calc(3px + var(--g)*38px) calc(var(--g)*7px) rgba(255,190,100,calc(var(--g)*.95));transition:--g .6s ease}
.wbox .halo{position:absolute;inset:-120% -40%;background:radial-gradient(closest-side,rgba(255,205,120,.5),rgba(255,205,120,0));opacity:calc(var(--g)*1.1);pointer-events:none;mix-blend-mode:screen}
.wbox .lab{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#eadbb6;color:#4a3020;font-family:var(--hand);font-size:clamp(10px,1.3vh,14px);line-height:1.15;padding:0 .45em;border-radius:1px;white-space:nowrap}
.wbox.jig{animation:jigb .12s linear infinite}
@keyframes jigb{50%{transform:translate(1px,-1px)}}

#fx{z-index:5}
#stage{position:absolute;inset:0;z-index:8;touch-action:none;pointer-events:none}
#stage.on{pointer-events:auto;cursor:crosshair}
#flash{position:absolute;inset:0;z-index:30;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--fx,50%) var(--fy,60%),#fff6dc 0%,#ffd28a 22%,#c87a30 55%,#3a1a08 100%)}

/* big box */
#bigbox{position:fixed;z-index:12;border-radius:4px;--c:#553;pointer-events:none}
#bigbox .tray{position:absolute;inset:0;border-radius:4px;background:radial-gradient(120% 140% at 50% 40%,#5a2440,#2a0c1c 70%);box-shadow:inset 0 0 0 3px var(--c),inset 0 0 0 4px rgba(226,190,120,.8),inset 0 6px 18px rgba(0,0,0,.7),0 18px 50px rgba(0,0,0,.75)}
#bigbox canvas{position:absolute;left:-10%;width:120%;top:-150%;height:400%;pointer-events:none}
#bigbox .lid{position:absolute;inset:-3px;border-radius:4px;background:linear-gradient(180deg,rgba(255,240,210,.25),rgba(0,0,0,0) 40%,rgba(0,0,0,.35)),var(--c);box-shadow:inset 0 0 0 1px rgba(226,190,120,.85),0 0 40px rgba(255,190,100,.45);display:grid;place-items:center}
#bigbox .lid span{background:#eadbb6;color:#4a3020;font-family:var(--hand);font-size:clamp(14px,3.6vw,20px);padding:.05em .8em;border-radius:2px}

/* note */
#note{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%) translateY(30px);width:min(93vw,560px);padding-top:13px;z-index:20;opacity:0;transition:opacity .6s ease,transform .7s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#note.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.note-in{position:relative;isolation:isolate;color:var(--ink);padding:25px 20px 18px;transition:opacity .35s}
.note-in.fade{opacity:0}
#noteBg{position:absolute;left:-24px;top:-28px;width:calc(100% + 48px);height:calc(100% + 56px);z-index:-1;pointer-events:none}
.note-in.nudge{animation:nudge .45s}
@keyframes nudge{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#8a5a2a;font-weight:700;min-height:14px}
.hand{font-family:var(--hand);font-size:clamp(23px,5.6vw,30px);line-height:1.12;color:#2a170b;margin-top:6px}
.nspec{font-size:14px;font-style:italic;font-weight:500;line-height:1.32;color:#4a3322;margin-top:6px}
.nspec:empty{display:none}
.nspec:not(:empty)+.hand{margin-top:18px}
.instr{font-size:clamp(16.5px,4.1vw,19px);line-height:1.32;margin-top:6px;color:#4a3322;font-weight:600}
.instr:empty{display:none}
.instr b{color:#6a2a10}
.status{font-size:15px;font-style:italic;color:#8a4a1a;margin-top:6px;font-weight:600;min-height:0}
.status:empty{display:none}
.nbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.nbtns:empty{display:none}
.nbtns.eq{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.btn{font:inherit;font-weight:700;font-size:17px;background:#2b1a0e;color:var(--gold2);border:1px solid #7a5428;padding:10px 20px;border-radius:999px;cursor:pointer;transition:transform .15s,box-shadow .2s}
.btn.ghost{background:transparent;color:#3a2516;border-color:#8a6a3a}
.btn:hover{box-shadow:0 0 18px rgba(255,190,100,.35)}
.btn:active{transform:scale(.97)}

.topbar{position:absolute;z-index:40;top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 12px);display:flex;gap:8px;align-items:center}
#snd{width:42px;height:42px;border-radius:50%;border:1px solid rgba(217,180,106,.55);background:rgba(14,10,20,.55);color:var(--gold2);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#snd svg{width:20px;height:20px}
#lang{display:flex;height:42px;border-radius:999px;border:1px solid rgba(217,180,106,.55);background:rgba(14,10,20,.55);padding:3px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#lang button{font:inherit;font-weight:700;font-size:15px;letter-spacing:.06em;border:0;background:transparent;color:#cdb78c;padding:0 11px;border-radius:999px;cursor:pointer}
#lang button.on{background:linear-gradient(180deg,#f2d38e,#c99a4e);color:#2a170b}

#camBox{position:absolute;z-index:22;top:calc(env(safe-area-inset-top) + 10px);left:calc(env(safe-area-inset-left) + 10px);width:clamp(112px,14vw,170px);aspect-ratio:4/5;filter:drop-shadow(0 8px 14px rgba(0,0,0,.65));transition:filter .4s}
#camBox.seen{filter:drop-shadow(0 8px 14px rgba(0,0,0,.65)) drop-shadow(0 0 12px rgba(255,200,110,.7))}
.cam-view{position:absolute;left:19%;right:19%;top:17%;bottom:17%;overflow:hidden;background:#120a06}
.cam-view video{width:100%;height:100%;display:block;object-fit:cover;transform:scaleX(-1);filter:sepia(.45) saturate(.8) contrast(1.05) brightness(.92)}
.cam-view::after{content:'';position:absolute;inset:0;background:radial-gradient(75% 70% at 50% 45%,rgba(40,20,6,0) 55%,rgba(30,14,4,.5) 100%);box-shadow:inset 0 0 5px rgba(0,0,0,.7)}
.cam-frame{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}

/* result */
#result{position:absolute;inset:0;z-index:35;display:flex;overflow-y:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(80% 70% at 50% 35%,rgba(40,20,8,.55),rgba(5,3,2,.88));opacity:0;transition:opacity .9s;padding:calc(env(safe-area-inset-top) + 66px) 16px calc(env(safe-area-inset-bottom) + 24px);-webkit-user-select:text;user-select:text}
#result.show{opacity:1}
.rcard{width:100%;max-width:480px;margin:auto;padding:30px 24px 26px;border-radius:8px;background:#160c07;box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 0 0 1px rgba(217,180,106,.55),inset 0 0 0 7px #160c07,inset 0 0 0 8px rgba(217,180,106,.25);text-align:center;transform:translateY(20px);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
#result.show .rcard{transform:none}
.r-kicker{font-size:12.5px;letter-spacing:.26em;text-transform:uppercase;color:#c79a55;font-weight:700}
.rcard h1{font-weight:700;font-size:clamp(32px,8.6vw,40px);line-height:1.05;margin-top:40px;background:linear-gradient(180deg,#fff2cc,#e2b866 60%,#b07c38);-webkit-background-clip:text;background-clip:text;color:transparent}
.rare{display:inline-block;margin-top:10px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#1a0f08;background:linear-gradient(90deg,#e8c983,#fff1c2,#e8c983);padding:3px 10px;border-radius:999px;font-weight:700}
#rStage{position:relative;z-index:0;height:184px;margin-top:16px}
#rStage::before{content:'';position:absolute;left:50%;top:50%;width:490px;height:490px;transform:translate(-50%,-50%);z-index:-1;pointer-events:none;background:radial-gradient(closest-side,#2c1a10,rgba(44,26,16,0) 70%)}
.rcard>*:not(#rStage){position:relative;z-index:1}
#rWand{width:100%;height:100%;display:block;transition:opacity .5s}
#rStage.is3d #rWand{opacity:0}
#rWand3d{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;opacity:0;transition:opacity .5s;pointer-events:none}
#rStage.is3d #rWand3d{opacity:1;pointer-events:auto}
#rWand3d:active{cursor:grabbing}
.r-specs{margin-top:16px;font-size:14px;font-weight:300;line-height:1.2;color:#ecdcb8;text-transform:lowercase}
.r-lore{max-width:348px;margin:60px auto 0;font-style:italic;font-weight:400;font-size:19px;line-height:1.35;color:#d6c3a0}
.cap{font-size:14px;color:#a8916c;font-style:italic;margin-top:8px}
.r-btns{display:grid;grid-template-columns:repeat(2,minmax(0,173px));gap:10px;justify-content:center;margin-top:48px}
.r-btns button{font:inherit;font-weight:700;font-size:clamp(14px,4.2vw,17px);line-height:21px;padding:10px 6px;border-radius:999px;cursor:pointer;border:1px solid #8a6230;background:#2b1a0e;color:var(--gold2)}
.r-btns button.pri{background:linear-gradient(180deg,#f2d38e,#c99a4e);color:#2a170b;border-color:#f2d38e}
.r-credit{display:inline-block;margin-top:48px;font-size:12px;font-style:italic;color:#c9b48c}
#rSaved{margin-top:12px}
#rSaved img{width:100%;max-width:280px;border-radius:6px;display:block;margin:0 auto;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
@media (prefers-reduced-motion:reduce){.curtain,#cta,.tw{animation:none}}
</style>
</head>

  <section id="street" class="scene">
    <div class="pl" id="stSky" data-d=".12"><svg id="svgSky" preserveAspectRatio="none"></svg></div>

    <div class="pl" id="stShop" data-d=".7"><svg id="svgShop" preserveAspectRatio="none">
      <defs>

        <radialGradient id="gFrost" cx="0" cy="1" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <radialGradient id="gFrost2" cx="1" cy="1" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></radialGradient>

      <path d="M302,493 Q401,520 500,493 Q599,520 698,493" fill="none" stroke="#173a24" stroke-width="8" stroke-linecap="round"/>
      <g id="garland"></g>
      <rect x="296" y="568" width="22" height="370" fill="#0c1610"/>

          <rect x="330" y="800" width="44" height="12"/><rect x="334" y="788" width="40" height="12"/><rect x="330" y="776" width="44" height="12"/><rect x="336" y="764" width="36" height="12"/>

          <path d="M528,932 L528,678 A70,70 0 0 1 668,678 L668,932Z" fill="url(#gDoor)"/>
          <path d="M548,690 A50,50 0 0 1 648,690 L648,722 L548,722Z" fill="url(#gWin)" opacity=".9"/>

  v3.yawG.rotation.y = v3.yaw + spinAngle(); v3.rollG.rotation.x = v3.roll; v3.gl.render(v3.scene, v3.cam); v3.frames++;
  if (v3.spin || v3.drag) v3.raf = requestAnimationFrame(tick3D); // otherwise nothing moves, so nothing to draw
}

/* ================= share card ================= */
const siteUrl = () => location.origin + location.pathname;
function wrapText(c, text, x, y, maxW, lh) { const words = text.split(' '); let line = '', yy = y; for (const w of words) { const t = line ? line + ' ' + w : w; if (c.measureText(t).width > maxW && line) { c.fillText(line, x, yy); line = w; yy += lh; } else line = t; } if (line) c.fillText(line, x, yy); return yy + lh; }
async function makeCard() {
  try { await document.fonts.ready; } catch (_) { }
  const w = st.winner, CW = 1080, CH = 1350, c = document.createElement('canvas'); c.width = CW; c.height = CH; const x = c.getContext('2d');
  let g = x.createRadialGradient(CW / 2, 300, 50, CW / 2, 600, 1100); g.addColorStop(0, '#2e1b10'); g.addColorStop(1, '#0b0604'); x.fillStyle = g; x.fillRect(0, 0, CW, CH);
  x.strokeStyle = 'rgba(217,180,106,.75)'; x.lineWidth = 3; x.strokeRect(40, 40, CW - 80, CH - 80); x.strokeStyle = 'rgba(217,180,106,.3)'; x.lineWidth = 1.5; x.strokeRect(56, 56, CW - 112, CH - 112);
  const serif = "'Cormorant Garamond', Georgia, serif";
  x.textAlign = 'center'; x.fillStyle = '#c79a55'; x.font = `700 34px ${serif}`; x.fillText(T('cardK').toUpperCase().split('').join(' '), CW / 2, 170);
  const tg = x.createLinearGradient(0, 190, 0, 420); tg.addColorStop(0, '#fff2cc'); tg.addColorStop(1, '#c9944a'); x.fillStyle = tg; x.font = `700 84px ${serif}`;
  wrapText(x, L(w.name), CW / 2, 290, 900, 92);
  drawWand(x, CW / 2, 650, 880 * (.8 + .2 * (w.lenN - 9.5) / 5.5), -.05, w, .6);
  x.fillStyle = '#ecdcb8'; x.font = `italic 500 44px ${serif}`; wrapText(x, L(w.lore), CW / 2, 910, 860, 56);
  // the default Vercel address is long, so the font shrinks to keep it inside the frame
  x.fillStyle = '#e8c27a'; let hostPx = 38; do { x.font = `600 ${hostPx}px ${serif}`; } while (x.measureText(location.host).width > 900 && --hostPx > 18); x.fillText(location.host, CW / 2, 1230);
  return new Promise(r => c.toBlob(r, 'image/png'));
}
// Made ahead of the click: browsers only allow the share sheet right after a tap, with no long wait before it.
let cardBlob = null;
function refreshCard() { cardBlob = null; const job = makeCard().then(b => { if (refreshCard.job === job) cardBlob = b; return b; }); refreshCard.job = job; return job; }
const cardFile = async () => new File([cardBlob || await refreshCard.job], lang === 'en' ? 'my-wand.png' : 'moya-palychka.png', { type: 'image/png' });
function canShareFiles() {
  try { return !!(navigator.share && navigator.canShare && navigator.canShare({ files: [new File([new Blob(['x'], { type: 'image/png' })], 'x.png', { type: 'image/png' })] })); } catch (_) { return false; }
}
function setShareMode(sheet) { $('#bShare').hidden = !sheet; $('#bDown').hidden = sheet; }
$('#bShare').addEventListener('click', async () => {
  try { await navigator.share({ files: [await cardFile()], text: T('invite'), url: siteUrl() }); }
  catch (e) { if (e && e.name !== 'AbortError') setShareMode(false); } // a cancelled sheet stays silent; anything else offers the download
});
$('#bDown').addEventListener('click', async () => {
  const file = await cardFile(), url = URL.createObjectURL(file);
  if (IN_APP) { $('#rSavedImg').src = url; $('#rSaved').hidden = false; return; } // these webviews usually block downloads, but pressing on an image works
  const a = document.createElement('a'); a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 10000);
});

/* ================= language ================= */
function applyLang() {
  document.documentElement.lang = lang === 'en' ? 'en' : 'uk'; document.title = T('title'); $('#street').setAttribute('aria-label', T('streetA')); $('#shop').setAttribute('aria-label', T('shopA'));
  $('#stT').textContent = T('title'); $('#stS').textContent = T('sub'); $('#cta').textContent = T('cta'); $('#stFan').textContent = T('fan');
  $('#sign1').textContent = T('sign1'); $('#sign2').textContent = T('sign2');
  document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  sndBtn.setAttribute('aria-label', T(A.on ? 'sndOff' : 'sndOn'));
  setViewBoxes(); // the title's height depends on the language
  if (st.noteFn) renderNote();
  if (!$('#result').hidden) fillResult();
}
document.querySelectorAll('#lang button').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); lang = b.dataset.l; try { localStorage.setItem('wand-lang', lang); } catch (_) { } applyLang(); }));

/* ================= enter ================= */
async function enterShop() {
  if (st.phase !== 'street') return; st.phase = 'entering';
  // Browsers allow sound only after a tap, so the entry tap is what starts it.
  if (A.on) { audioInit(); if (A.ctx && A.ctx.state === 'suspended') A.ctx.resume(); SFX.bell(); }
  $('#cta').style.opacity = 0; $('#stFan').style.opacity = 0; $('#stTitle').style.opacity = 0; $('#stTitle').style.transform = 'translateY(-20px)';
  const dr = $('#doorHit').getBoundingClientRect(), cx = dr.left + dr.width / 2, cy = dr.top + dr.height * .55;
  ['stSky', 'stTown', 'stShop', 'stFg'].map(id => layers[id]).forEach(Ly => { const r = Ly.el.getBoundingClientRect(); Ly.el.style.transformOrigin = `${(cx - r.left) / Ly.s}px ${(cy - r.top) / Ly.s}px`; });
  const fl = $('#flash'); fl.style.setProperty('--fx', cx + 'px'); fl.style.setProperty('--fy', cy + 'px');
  const leaf = $('#doorLeaf'), dur = 1900, t0 = performance.now();
  const shop = $('#shop'); shop.hidden = false; st.shopVisible = true; buildInterior();
  ['shBack', 'shMid', 'shFront'].forEach(id => layers[id].s = 1.32); shop.style.opacity = 0; fx.style.opacity = 0;
  await new Promise(res => {
    const step = () => {
      const t = clamp((performance.now() - t0) / dur);
      const d = easeOut(clamp(t / .35)); leaf.setAttribute('transform', `translate(528 0) scale(${(1 - .86 * d).toFixed(3)} 1) translate(-528 0)`);
      const z = easeIO(clamp((t - .12) / .88));
      layers.stSky.s = 1 + .25 * z; layers.stTown.s = 1 + 1.6 * z; layers.stShop.s = 1 + 6 * Math.pow(z, 1.7); layers.stFg.s = 1 + 9 * Math.pow(z, 1.5);
      layers.stShop.blur = z > .5 ? (z - .5) * 10 : 0; layers.stFg.blur = z * 8;
      fl.style.opacity = clamp((t - .5) / .4); drawSnow(performance.now(), 1 - z);
      if (t < 1) requestAnimationFrame(step); else res();
    };
    step();
  });
  $('#street').hidden = true; shop.style.opacity = 1; const t1 = performance.now();
  await new Promise(res => {
    const step = () => {
      const t = clamp((performance.now() - t1) / 1300), e = easeOut(t);
      ['shBack', 'shMid', 'shFront'].forEach((id, i) => layers[id].s = 1 + (.32 + i * .08) * (1 - e));
      fl.style.opacity = 1 - easeOut(clamp(t / .75)); fx.style.opacity = clamp((t - .4) / .6);
      if (t < 1) requestAnimationFrame(step); else res();
    };
    step();
  });
  st.phase = 'shop';
  setNote(() => (IN_APP
    ? { kicker: T('shopK'), hand: T('introH'), instr: T('introI') + ' ' + T('inAppHint'), btns: [{ label: T('bDraw'), fn: choosePointer }] }
    : { kicker: T('shopK'), hand: T('introH'), instr: T('introI'), btns: [{ label: T('bCam'), fn: chooseCam }, { label: T('bDraw'), fn: choosePointer, ghost: true }] }));
}
function choosePointer() { st.input = 'pointer'; stopCamera(); ritual(); }
function camFallback(key) {
  stopCamera(); st.input = 'pointer';
  setNote(() => ({ kicker: T('shopK'), hand: T('camFailH'), instr: T(key), btns: [{ label: T('bGo'), fn: () => ritual() }] }), true);
}
async function chooseCam() {
  st.input = 'cam'; let offer = false; const waiting = () => st.input === 'cam' && !cam.on;
  setNote(() => ({ kicker: T('shopK'), hand: T('camLoadH'), instr: T('camLoadI'), btns: offer ? [{ label: T('bInstead'), ghost: true, fn: choosePointer }] : [] }), true);
  const t6 = setTimeout(() => { if (waiting()) { offer = true; renderNote(); setStatus(T('camSlow')); } }, 6000);
  // 15 s to load once the camera is allowed, 30 s for an unanswered prompt. A grant arriving after the fallback is dropped in openStream.
  const giveUp = () => { if (waiting()) camFallback('camTimeout'); }; let limit = setTimeout(giveUp, 30000);
  cam.onGrant = () => { clearTimeout(limit); limit = setTimeout(giveUp, 15000); };
  try { if (await startCamera()) ritual(); }
  catch (e) { if (st.input === 'cam') camFallback(camErrKey(e)); } // otherwise the person has already moved on to the pointer
  finally { clearTimeout(t6); clearTimeout(limit); cam.onGrant = null; }
}
function buildInterior() { drawBack(); drawMid(); drawFront(); initFX(); }
// A tap enters the shop. A drag moves the scene instead, like the mouse on desktop, and eases back to the drift on release.
const street = $('#street');
street.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') Object.assign(touch, { on: true, moved: false, x: e.clientX, y: e.clientY }); });
street.addEventListener('pointermove', e => {
  if (!touch.on) return;
  if (Math.hypot(e.clientX - touch.x, e.clientY - touch.y) > 10) touch.moved = true;
  if (!reduceMotion) { par.tx = clamp(e.clientX / W * 2 - 1, -1, 1); par.ty = clamp(e.clientY / H * 2 - 1, -1, 1); }
});
const endTouch = () => { touch.on = false; }; street.addEventListener('pointerup', endTouch); street.addEventListener('pointercancel', endTouch);
street.addEventListener('click', () => { if (touch.moved) { touch.moved = false; return; } enterShop(); });
addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && st.phase === 'street') enterShop(); });

/* ================= boot ================= */
function onResize() {
  W = innerWidth; H = innerHeight; MIN = Math.min(W, H);
  setViewBoxes(); initSnow();
  if (st.shopVisible) { drawBack(); drawMid(); drawFront(); fxc = sizeCanvas(fx, W, H); }
}
let rT = 0; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(onResize, 120); });
buildSky(); buildTown(); buildFg(); buildGarland(); setViewBoxes(); initSnow(); applyLang();
let last = performance.now();
function frame(t) {
  requestAnimationFrame(frame); // first, so an error in one frame can't stop the game
  const dt = Math.min(50, t - last); last = t; now = t;
  updatePar(t);
  if (st.phase === 'street') drawSnow(t);
  camTick(t);
  if (st.shopVisible && fxc) { liveTick(t); drawFX(t, dt); if (A.on && t > A.nextCrackle) { SFX.crackle(); A.nextCrackle = t + 120 + Math.random() * 500; } }
}
requestAnimationFrame(frame);
})();
</script>
