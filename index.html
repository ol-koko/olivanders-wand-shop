<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Крамниця Олівандера</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Marck+Script&display=swap" rel="stylesheet">
<style>
@property --g{syntax:'<number>';inherits:true;initial-value:0}
:root{--gold:#d9b46a;--gold2:#f6e2ae;--ink:#3a2516;--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--hand:'Marck Script','Segoe Script','Bradley Hand',cursive}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;background:#07060a;overflow:hidden;color:#f3e6c8;font-family:var(--serif);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden;background:#07060a}
#app.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,3px) rotate(-.4deg)}40%,60%{transform:translate(7px,-3px) rotate(.4deg)}}
.scene{position:absolute;inset:0;overflow:hidden}
.pl{position:absolute;left:-4%;top:-4%;width:108%;height:108%;will-change:transform;transform-origin:50% 50%}
.pl>svg,.pl>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.full{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}

/* street */
#street{cursor:pointer}
.st-title{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 7vh);text-align:center;pointer-events:none;transition:opacity .6s,transform .8s;padding:0 18px}
.st-title h1{font-weight:600;font-size:clamp(38px,8.6vw,72px);line-height:1;letter-spacing:.01em;background:linear-gradient(180deg,#fff4d2 10%,#e8c27a 55%,#b4823e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,200,120,.35)) drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.st-title p{margin:12px auto 0;max-width:560px;font-style:italic;font-size:clamp(17px,4vw,23px);line-height:1.3;color:#e2d6bd;text-shadow:0 1px 8px rgba(0,0,0,.9)}
#cta{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + max(5.5vh, 34px));transform:translateX(-50%);padding:13px 30px;border-radius:999px;background:linear-gradient(180deg,#f4d895,#c99a4e);border:1px solid #fff0c4;color:#2a170b;font:inherit;font-size:clamp(19px,4.6vw,22px);font-weight:700;letter-spacing:.01em;white-space:nowrap;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.55),0 0 26px rgba(255,200,110,.35);animation:ctap 2.6s ease-in-out infinite;transition:opacity .5s}
.st-fan{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 7px);text-align:center;font-style:italic;font-size:12.5px;line-height:1.2;padding:0 12px;font-weight:600;color:#232b45;pointer-events:none;transition:opacity .5s}
@keyframes ctap{50%{box-shadow:0 8px 30px rgba(0,0,0,.55),0 0 44px rgba(255,200,110,.65);transform:translateX(-50%) translateY(-3px)}}
.tw{animation:tw 2.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.leak{animation:leak 3s ease-in-out infinite}
@keyframes leak{50%{opacity:.55}}

/* shop */
#shop{opacity:0}
.curtain{position:absolute;top:3.4%;width:clamp(80px,15vw,230px);height:44%;pointer-events:none;transform-origin:50% 0;animation:sway 7s ease-in-out infinite alternate}
.curtain.l{left:3.6%}
.curtain.r{right:3.6%;transform:scaleX(-1);animation-name:swayr}
.curtain svg{width:100%;height:100%;display:block}
@keyframes sway{from{transform:rotate(.5deg) skewX(.4deg)}to{transform:rotate(-.6deg) skewX(-.6deg)}}
@keyframes swayr{from{transform:scaleX(-1) rotate(.5deg) skewX(.4deg)}to{transform:scaleX(-1) rotate(-.6deg) skewX(-.6deg)}}
.wind .curtain{animation-duration:.9s}

.wbox{position:absolute;border-radius:2px;--g:0;background:linear-gradient(180deg,rgba(255,240,210,.22),rgba(0,0,0,0) 45%,rgba(0,0,0,.35)),var(--c);box-shadow:inset 0 0 0 1px rgba(226,190,120,.75),0 2px 4px rgba(0,0,0,.7),0 0 calc(3px + var(--g)*38px) calc(var(--g)*7px) rgba(255,190,100,calc(var(--g)*.95));transition:--g .6s ease}
.wbox .halo{position:absolute;inset:-120% -40%;background:radial-gradient(closest-side,rgba(255,205,120,.5),rgba(255,205,120,0));opacity:calc(var(--g)*1.1);pointer-events:none;mix-blend-mode:screen}
.wbox .lab{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#eadbb6;color:#4a3020;font-family:var(--hand);font-size:clamp(10px,1.3vh,14px);line-height:1.15;padding:0 .45em;border-radius:1px;white-space:nowrap}
.wbox.jig{animation:jigb .12s linear infinite}
@keyframes jigb{50%{transform:translate(1px,-1px)}}

#fx{z-index:5}
#stage{position:absolute;inset:0;z-index:8;touch-action:none;pointer-events:none}
#stage.on{pointer-events:auto;cursor:crosshair}
#flash{position:absolute;inset:0;z-index:30;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--fx,50%) var(--fy,60%),#fff6dc 0%,#ffd28a 22%,#c87a30 55%,#3a1a08 100%)}

/* big box */
#bigbox{position:fixed;z-index:12;border-radius:4px;--c:#553;pointer-events:none}
#bigbox .tray{position:absolute;inset:0;border-radius:4px;background:radial-gradient(120% 140% at 50% 40%,#5a2440,#2a0c1c 70%);box-shadow:inset 0 0 0 3px var(--c),inset 0 0 0 4px rgba(226,190,120,.8),inset 0 6px 18px rgba(0,0,0,.7),0 18px 50px rgba(0,0,0,.75)}
#bigbox canvas{position:absolute;left:-10%;width:120%;top:-150%;height:400%;pointer-events:none}
#bigbox .lid{position:absolute;inset:-3px;border-radius:4px;background:linear-gradient(180deg,rgba(255,240,210,.25),rgba(0,0,0,0) 40%,rgba(0,0,0,.35)),var(--c);box-shadow:inset 0 0 0 1px rgba(226,190,120,.85),0 0 40px rgba(255,190,100,.45);display:grid;place-items:center}
#bigbox .lid span{background:#eadbb6;color:#4a3020;font-family:var(--hand);font-size:clamp(14px,3.6vw,20px);padding:.05em .8em;border-radius:2px}

/* note */
#note{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%) translateY(30px);width:min(93vw,560px);z-index:20;opacity:0;transition:opacity .6s ease,transform .7s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#note.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.note-in{position:relative;background:radial-gradient(130% 150% at 40% 0%,#f7eed6 0%,#ead9b2 55%,#d7bf8c 100%);color:var(--ink);border-radius:5px;padding:15px 20px 16px;box-shadow:0 14px 44px rgba(0,0,0,.65),inset 0 0 34px rgba(130,85,30,.28),inset 0 0 0 1px rgba(120,80,30,.25);transition:opacity .35s}
.note-in.fade{opacity:0}
.note-in.nudge{animation:nudge .45s}
@keyframes nudge{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#8a5a2a;font-weight:700;min-height:14px}
.hand{font-family:var(--hand);font-size:clamp(23px,5.6vw,30px);line-height:1.12;color:#2a170b;margin-top:4px}
.instr{font-size:clamp(16.5px,4.1vw,19px);line-height:1.32;margin-top:6px;color:#4a3322;font-weight:600}
.instr:empty{display:none}
.instr b{color:#6a2a10}
.status{font-size:15px;font-style:italic;color:#8a4a1a;margin-top:6px;font-weight:600;min-height:0}
.status:empty{display:none}
.nbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.nbtns:empty{display:none}
.btn{font:inherit;font-weight:700;font-size:17px;background:#2b1a0e;color:var(--gold2);border:1px solid #7a5428;padding:10px 20px;border-radius:999px;cursor:pointer;transition:transform .15s,box-shadow .2s}
.btn.ghost{background:transparent;color:#3a2516;border-color:#8a6a3a}
.btn:hover{box-shadow:0 0 18px rgba(255,190,100,.35)}
.btn:active{transform:scale(.97)}

.topbar{position:absolute;z-index:40;top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 12px);display:flex;gap:8px;align-items:center}
#snd{width:42px;height:42px;border-radius:50%;border:1px solid rgba(217,180,106,.55);background:rgba(14,10,20,.55);color:var(--gold2);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#snd svg{width:20px;height:20px}
#lang{display:flex;height:42px;border-radius:999px;border:1px solid rgba(217,180,106,.55);background:rgba(14,10,20,.55);padding:3px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#lang button{font:inherit;font-weight:700;font-size:15px;letter-spacing:.06em;border:0;background:transparent;color:#cdb78c;padding:0 11px;border-radius:999px;cursor:pointer}
#lang button.on{background:linear-gradient(180deg,#f2d38e,#c99a4e);color:#2a170b}

#camBox{position:absolute;z-index:22;top:calc(env(safe-area-inset-top) + 12px);left:calc(env(safe-area-inset-left) + 12px);width:clamp(84px,14vw,128px);aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px rgba(217,180,106,.8),0 0 0 6px rgba(20,10,4,.6),0 8px 24px rgba(0,0,0,.6);background:#120a06}
#camBox video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.85}
#camBox.seen{box-shadow:0 0 0 2px #ffe2a0,0 0 22px rgba(255,200,110,.75),0 8px 24px rgba(0,0,0,.6)}

/* result */
#result{position:absolute;inset:0;z-index:35;overflow-y:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(80% 70% at 50% 35%,rgba(40,20,8,.55),rgba(5,3,2,.88));opacity:0;transition:opacity .9s;padding:calc(env(safe-area-inset-top) + 66px) 14px calc(env(safe-area-inset-bottom) + 30px);-webkit-user-select:text;user-select:text}
#result.show{opacity:1}
.rcard{max-width:480px;margin:0 auto;padding:30px 24px 26px;border-radius:8px;background:radial-gradient(120% 80% at 50% 0%,#2c1a10,#160c07 70%);box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 0 0 1px rgba(217,180,106,.55),inset 0 0 0 7px rgba(22,12,7,1),inset 0 0 0 8px rgba(217,180,106,.25);text-align:center;transform:translateY(20px);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
#result.show .rcard{transform:none}
.r-kicker{font-size:12.5px;letter-spacing:.26em;text-transform:uppercase;color:#c79a55;font-weight:700}
.rcard h1{font-weight:700;font-size:clamp(30px,7.4vw,40px);line-height:1.05;margin-top:8px;background:linear-gradient(180deg,#fff2cc,#e2b866 60%,#b07c38);-webkit-background-clip:text;background-clip:text;color:transparent}
.rare{display:inline-block;margin-top:10px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#1a0f08;background:linear-gradient(90deg,#e8c983,#fff1c2,#e8c983);padding:3px 10px;border-radius:999px;font-weight:700}
#rStage{position:relative;height:150px;margin:6px -12px 0}
#rWand{width:100%;height:100%;display:block;transition:opacity .5s}
#rStage.is3d #rWand{opacity:0}
#rWand3d{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:pan-y;opacity:0;transition:opacity .5s;pointer-events:none}
#rStage.is3d #rWand3d{opacity:1;pointer-events:auto}
#rWand3d:active{cursor:grabbing}
.r-spin{font-size:14px;font-style:italic;color:#a8916c;margin:-4px 0 8px}
.r-specs{font-size:18px;color:#ecdcb8;font-weight:600}
.r-specs.unk{font-style:italic;font-weight:500;color:#c9b48c}
.r-lore{font-style:italic;font-size:19px;line-height:1.35;color:#d6c3a0;margin-top:10px}
.r-sec{margin-top:22px;text-align:left}
.r-sec h2{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#c79a55;font-weight:700;margin-bottom:10px;text-align:center}
#rWhy{list-style:none;display:grid;gap:8px}
#rWhy li{font-size:18px;line-height:1.3;color:#f1e3c4;padding-left:22px;position:relative}
#rWhy li::before{content:'✦';position:absolute;left:0;top:1px;color:#e2b866;font-size:14px}
.meter{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:10px;margin:7px 0}
.meter .ml{font-size:16px;font-weight:700;color:#e8d6b0}
.meter .mt{position:relative;height:10px;border-radius:99px;background:rgba(255,230,180,.1);box-shadow:inset 0 0 0 1px rgba(217,180,106,.25)}
.meter .mf{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#8a5a24,#f0c878);width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.meter .mk{position:absolute;top:-5px;width:3px;height:20px;margin-left:-1.5px;background:#fff2cc;border-radius:2px;box-shadow:0 0 8px rgba(255,220,150,.9)}
.meter .me{grid-column:2;display:flex;justify-content:space-between;font-size:12.5px;color:#a8916c;margin-top:-4px;font-style:italic}
.legend{font-size:13.5px;color:#a8916c;text-align:center;margin-top:6px;font-style:italic}
.sig{text-align:center}
#rSig{width:100%;max-width:300px;aspect-ratio:1.25;display:block;margin:0 auto;border-radius:6px;background:radial-gradient(closest-side,#24140b,#120904);box-shadow:inset 0 0 0 1px rgba(217,180,106,.3)}
.cap{font-size:14px;color:#a8916c;font-style:italic;margin-top:8px}
.r-almost{margin-top:20px;font-size:17px;color:#d8c6a2;line-height:1.4;padding:12px 14px;border-radius:6px;background:rgba(255,230,180,.05);box-shadow:inset 0 0 0 1px rgba(217,180,106,.2)}
.r-almost p+p{margin-top:8px}
.r-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.r-btns button{font:inherit;font-weight:700;font-size:17px;padding:10px 18px;border-radius:999px;cursor:pointer;border:1px solid #8a6230;background:#2b1a0e;color:var(--gold2)}
.r-btns button.pri{background:linear-gradient(180deg,#f2d38e,#c99a4e);color:#2a170b;border-color:#f2d38e}
.r-msg{min-height:20px;margin-top:10px;font-size:15px;color:#c9b48c;font-style:italic}
.r-fine{margin-top:6px;font-size:13.5px;color:#8f7b5c;font-style:italic}
@media (prefers-reduced-motion:reduce){.curtain,#cta,.tw{animation:none}}
</style>
</head>

<div id="app">
  <section id="street" class="scene" aria-label="Зимова вулиця перед крамницею">
    <div class="pl" id="stSky" data-d=".12"><svg id="svgSky" preserveAspectRatio="none"></svg></div>
    <canvas id="snowBack" class="full"></canvas>
    <div class="pl" id="stTown" data-d=".4"><svg id="svgTown" preserveAspectRatio="none"></svg></div>
    <div class="pl" id="stShop" data-d=".7"><svg id="svgShop" preserveAspectRatio="none">
      <defs>
        <linearGradient id="gWin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffdc9c"/><stop offset=".55" stop-color="#f3a64c"/><stop offset="1" stop-color="#b4581b"/></linearGradient>
        <radialGradient id="gGlow"><stop offset="0" stop-color="#ffc56e" stop-opacity=".6"/><stop offset="1" stop-color="#ffc56e" stop-opacity="0"/></radialGradient>
        <linearGradient id="gWall" x1="0" x2="1"><stop offset="0" stop-color="#101d16"/><stop offset=".5" stop-color="#1c3226"/><stop offset="1" stop-color="#0f1b14"/></linearGradient>
        <linearGradient id="gDoorL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3d2"/><stop offset="1" stop-color="#ffb55e"/></linearGradient>
        <linearGradient id="gDoor" x1="0" x2="1"><stop offset="0" stop-color="#3b2416"/><stop offset="1" stop-color="#22140b"/></linearGradient>
        <radialGradient id="gFrost" cx="0" cy="1" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <radialGradient id="gFrost2" cx="1" cy="1" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></radialGradient>
      </defs>
      <ellipse cx="500" cy="955" rx="380" ry="70" fill="url(#gGlow)"/>
      <polygon points="268,482 500,388 732,482" fill="#1a1420"/>
      <polygon points="300,480 500,402 700,480" fill="#16271d"/>

      <path d="M258,486 L500,380 L742,486 L732,494 L716,490 L708,500 L690,484 L500,400 L310,484 L296,498 L286,488 L268,494Z" fill="#e8eef9"/>
      <rect x="296" y="480" width="408" height="460" fill="url(#gWall)"/>
      <rect x="312" y="490" width="376" height="78" rx="4" fill="#100a07" stroke="#b8924a" stroke-width="3"/>
      <rect x="321" y="498" width="358" height="62" rx="2" fill="none" stroke="#5e4628" stroke-width="1.2"/>
      <text x="500" y="534" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-weight="700" font-size="40" letter-spacing="7" fill="#e6c27a" id="sign1" textLength="330" lengthAdjust="spacingAndGlyphs">ОЛІВАНДЕР</text>
      <text x="500" y="555" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-style="italic" font-size="15" fill="#bfa070" id="sign2">чарівні палички · з 382 р. до н. е.</text>
      <path d="M308,491 Q320,482 360,484 Q420,480 500,483 Q590,480 650,484 Q682,482 692,491 L688,494 Q600,488 500,490 Q400,488 312,494Z" fill="#eef3fb"/>
      <path d="M302,493 Q401,520 500,493 Q599,520 698,493" fill="none" stroke="#173a24" stroke-width="8" stroke-linecap="round"/>
      <g id="garland"></g>
      <rect x="296" y="568" width="22" height="370" fill="#0c1610"/>
      <rect x="682" y="568" width="22" height="370" fill="#0c1610"/>
      <rect x="500" y="568" width="18" height="370" fill="#0c1610"/>
      <g>
        <rect x="326" y="592" width="166" height="246" fill="url(#gWin)"/>
        <g fill="#7a4220" opacity=".55">
          <rect x="330" y="800" width="44" height="12"/><rect x="334" y="788" width="40" height="12"/><rect x="330" y="776" width="44" height="12"/><rect x="336" y="764" width="36" height="12"/>
          <rect x="446" y="800" width="42" height="12"/><rect x="450" y="788" width="38" height="12"/><rect x="444" y="776" width="44" height="12"/>
          <rect x="330" y="632" width="40" height="11"/><rect x="333" y="621" width="36" height="11"/><rect x="452" y="632" width="36" height="11"/>
        </g>
        <rect x="372" y="796" width="74" height="10" fill="#3b1a10" opacity=".7"/>
        <ellipse cx="409" cy="790" rx="34" ry="9" fill="#6a2448"/>
        <line x1="384" y1="782" x2="436" y2="776" stroke="#2a1608" stroke-width="4" stroke-linecap="round"/>
        <rect x="405" y="592" width="5" height="246" fill="#0b130e"/>
        <rect x="364" y="592" width="3" height="246" fill="#0b130e"/><rect x="448" y="592" width="3" height="246" fill="#0b130e"/>
        <rect x="326" y="670" width="166" height="4" fill="#0b130e"/><rect x="326" y="752" width="166" height="4" fill="#0b130e"/>
        <rect x="326" y="740" width="90" height="98" fill="url(#gFrost)"/>
        <rect x="402" y="740" width="90" height="98" fill="url(#gFrost2)"/>
        <rect x="322" y="588" width="174" height="254" fill="none" stroke="#0b130e" stroke-width="9"/>
        <rect x="314" y="840" width="190" height="12" fill="#0b130e"/>
        <path d="M312,842 Q330,830 360,834 Q410,828 460,834 Q495,830 506,842Z" fill="#eef3fb"/>
      </g>
      <g id="doorG">
        <path d="M528,932 L528,678 A70,70 0 0 1 668,678 L668,932Z" fill="url(#gDoorL)"/>
        <g id="doorLeaf">
          <path d="M528,932 L528,678 A70,70 0 0 1 668,678 L668,932Z" fill="url(#gDoor)"/>
          <path d="M548,690 A50,50 0 0 1 648,690 L648,722 L548,722Z" fill="url(#gWin)" opacity=".9"/>
          <line x1="598" y1="640" x2="598" y2="722" stroke="#22140b" stroke-width="3"/>
          <rect x="548" y="740" width="100" height="78" fill="none" stroke="#1a0e07" stroke-width="3"/>
          <rect x="548" y="834" width="100" height="80" fill="none" stroke="#1a0e07" stroke-width="3"/>

async function show3D(w) {

    if (!v3.gl) {

      v3.scene = new THREE.Scene(); v3.cam = new THREE.PerspectiveCamera(18, 1, .1, 20);
      v3.yawG = new THREE.Group(); v3.rollG = new THREE.Group(); v3.yawG.add(v3.rollG); v3.scene.add(v3.yawG);

      cv.addEventListener('pointermove', e => { if (!v3.drag) return; v3.yaw += (e.clientX - v3.drag.x) * .012; if (e.pointerType === 'mouse') v3.roll += (e.clientY - v3.drag.y) * .012; v3.drag = { x: e.clientX, y: e.clientY }; });
      const up = () => { v3.drag = null; }; cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    }
    if (v3.mesh) { v3.rollG.remove(v3.mesh); v3.mesh.geometry.dispose(); v3.mesh.material.map.dispose(); v3.mesh.material.dispose(); }

function hide3D() { v3.wand = null; v3.run = false; $('#rStage').classList.remove('is3d'); $('#rSpin').hidden = true; }
function wake3D() { if (v3.run && v3.seen && !document.hidden && !v3.raf) { v3.last = performance.now(); v3.raf = requestAnimationFrame(tick3D); } }

/* ================= save card ================= */
let downloads = null;
if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(d => { downloads = d; if (d) $('#bSave').hidden = false; }).catch(() => { });
function wrapText(c, text, x, y, maxW, lh) { const words = text.split(' '); let line = '', yy = y; for (const w of words) { const t = line ? line + ' ' + w : w; if (c.measureText(t).width > maxW && line) { c.fillText(line, x, yy); line = w; yy += lh; } else line = t; } if (line) c.fillText(line, x, yy); return yy + lh; }
async function makeCard() {
  try { await document.fonts.ready; } catch (_) { }
  const w = st.winner, CW = 1080, CH = 1500, c = document.createElement('canvas'); c.width = CW; c.height = CH; const x = c.getContext('2d');
  let g = x.createRadialGradient(CW / 2, 300, 50, CW / 2, 600, 1100); g.addColorStop(0, '#2e1b10'); g.addColorStop(1, '#0b0604'); x.fillStyle = g; x.fillRect(0, 0, CW, CH);
  x.strokeStyle = 'rgba(217,180,106,.75)'; x.lineWidth = 3; x.strokeRect(40, 40, CW - 80, CH - 80); x.strokeStyle = 'rgba(217,180,106,.3)'; x.lineWidth = 1.5; x.strokeRect(56, 56, CW - 112, CH - 112);
  const serif = "'Cormorant Garamond', Georgia, serif";
  x.textAlign = 'center'; x.fillStyle = '#c79a55'; x.font = `700 30px ${serif}`; x.fillText(T('rKicker').toUpperCase().split('').join(' '), CW / 2, 150);
  const tg = x.createLinearGradient(0, 180, 0, 320); tg.addColorStop(0, '#fff2cc'); tg.addColorStop(1, '#c9944a'); x.fillStyle = tg; x.font = `700 70px ${serif}`;
  let y = wrapText(x, L(w.name), CW / 2, 250, 920, 78);
  drawWand(x, CW / 2, y + 60, 780 * (.8 + .2 * (w.lenN - 9.5) / 5.5), -.05, w, .6);
  y += 170; x.fillStyle = '#ecdcb8'; x.font = `${w.spec ? '600' : 'italic 500'} 34px ${serif}`; y = wrapText(x, specText(w), CW / 2, y, 900, 42);
  x.fillStyle = '#d6c3a0'; x.font = `italic 500 34px ${serif}`; y = wrapText(x, L(w.lore), CW / 2, y + 20, 860, 44);
  const sgY = y + 10, sgH = 420; x.fillStyle = 'rgba(0,0,0,.25)'; x.fillRect(200, sgY, 680, sgH); x.strokeStyle = 'rgba(217,180,106,.3)'; x.strokeRect(200, sgY, 680, sgH);
  drawSigil(x, st.stroke, 200, sgY, 680, sgH);
  x.fillStyle = '#a8916c'; x.font = `italic 500 26px ${serif}`; x.fillText(T('sigH'), CW / 2, sgY + sgH + 40);
  y = sgY + sgH + 100; x.fillStyle = '#f1e3c4'; x.font = `500 31px ${serif}`;
  for (const l of whyLines(w, st.traits)) y = wrapText(x, '✦ ' + l, CW / 2, y, 880, 40) + 4;
  x.fillStyle = '#8f7b5c'; x.font = `italic 500 26px ${serif}`; x.fillText(T('cardFoot'), CW / 2, CH - 90);
  return new Promise(r => c.toBlob(r, 'image/png'));
}
$('#bSave').addEventListener('click', async () => {
  const msg = $('#rMsg'); if (!downloads) return; msg.textContent = T('saving');
  try { const blob = await makeCard(); await downloads.save({ filename: lang === 'en' ? 'my-wand.png' : 'moya-palychka.png', data: blob }); msg.textContent = T('saved'); }
  catch (e) { msg.textContent = e && e.code === 'declined' ? T('declined') : T('saveFail'); }
});

/* ================= language ================= */
function applyLang() {
  document.documentElement.lang = lang === 'en' ? 'en' : 'uk'; document.title = T('title');
  $('#stT').textContent = T('title'); $('#stS').textContent = T('sub'); $('#cta').textContent = T('cta'); $('#stFan').textContent = T('fan');
  $('#sign1').textContent = T('sign1'); $('#sign2').textContent = T('sign2');
  document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  sndBtn.setAttribute('aria-label', T(A.on ? 'sndOff' : 'sndOn'));

document.querySelectorAll('#lang button').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); lang = b.dataset.l; try { localStorage.setItem('wand-lang', lang); } catch (_) { } applyLang(); }));

/* ================= enter ================= */
async function enterShop() {
  if (st.phase !== 'street') return; st.phase = 'entering';
  if (A.on) SFX.bell();
  $('#cta').style.opacity = 0; $('#stFan').style.opacity = 0; $('#stTitle').style.opacity = 0; $('#stTitle').style.transform = 'translateY(-20px)';
  const dr = $('#doorHit').getBoundingClientRect(), cx = dr.left + dr.width / 2, cy = dr.top + dr.height * .55;
  ['stSky', 'stTown', 'stShop', 'stFg'].map(id => layers[id]).forEach(Ly => { const r = Ly.el.getBoundingClientRect(); Ly.el.style.transformOrigin = `${(cx - r.left) / Ly.s}px ${(cy - r.top) / Ly.s}px`; });
  const fl = $('#flash'); fl.style.setProperty('--fx', cx + 'px'); fl.style.setProperty('--fy', cy + 'px');
  const leaf = $('#doorLeaf'), dur = 1900, t0 = performance.now();
  const shop = $('#shop'); shop.hidden = false; st.shopVisible = true; buildInterior();
  ['shBack', 'shMid', 'shFront'].forEach(id => layers[id].s = 1.32); shop.style.opacity = 0; fx.style.opacity = 0;
  await new Promise(res => {
    const step = () => {
      const t = clamp((performance.now() - t0) / dur);
      const d = easeOut(clamp(t / .35)); leaf.setAttribute('transform', `translate(528 0) scale(${(1 - .86 * d).toFixed(3)} 1) translate(-528 0)`);
      const z = easeIO(clamp((t - .12) / .88));
      layers.stSky.s = 1 + .25 * z; layers.stTown.s = 1 + 1.6 * z; layers.stShop.s = 1 + 6 * Math.pow(z, 1.7); layers.stFg.s = 1 + 9 * Math.pow(z, 1.5);
      layers.stShop.blur = z > .5 ? (z - .5) * 10 : 0; layers.stFg.blur = z * 8;
      fl.style.opacity = clamp((t - .5) / .4); drawSnow(performance.now(), 1 - z);
      if (t < 1) requestAnimationFrame(step); else res();
    };
    step();
  });
  $('#street').hidden = true; shop.style.opacity = 1; const t1 = performance.now();
  await new Promise(res => {
    const step = () => {
      const t = clamp((performance.now() - t1) / 1300), e = easeOut(t);
      ['shBack', 'shMid', 'shFront'].forEach((id, i) => layers[id].s = 1 + (.32 + i * .08) * (1 - e));

}
function choosePointer() { st.input = 'pointer'; stopCamera(); ritual(); }
function camFallback(key) {
  stopCamera(); st.input = 'pointer';
  setNote(() => ({ kicker: T('shopK'), hand: T('camFailH'), instr: T(key), btns: [{ label: T('bGo'), fn: () => ritual() }] }), true);
}
async function chooseCam() {
  st.input = 'cam'; let offer = false; const waiting = () => st.input === 'cam' && !cam.on;
  setNote(() => ({ kicker: T('shopK'), hand: T('camLoadH'), instr: T('camLoadI'), btns: offer ? [{ label: T('bInstead'), ghost: true, fn: choosePointer }] : [] }), true);
  const t6 = setTimeout(() => { if (waiting()) { offer = true; renderNote(); setStatus(T('camSlow')); } }, 6000);
  const t15 = setTimeout(() => { if (waiting()) camFallback('camTimeout'); }, 15000); // a grant arriving after this is dropped in openStream

$('#street').addEventListener('click', enterShop);
addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && st.phase === 'street') enterShop(); });

/* ================= boot ================= */
function onResize() {
  W = innerWidth; H = innerHeight; MIN = Math.min(W, H);
  setViewBoxes(); initSnow();
  if (st.shopVisible) { drawBack(); drawMid(); drawFront(); fxc = sizeCanvas(fx, W, H); }
}
let rT = 0; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(onResize, 120); });

let last = performance.now();
function frame(t) {
  requestAnimationFrame(frame); // first, so an error in one frame can't stop the game
  const dt = Math.min(50, t - last); last = t; now = t;
  updatePar(t);
  if (st.phase === 'street') drawSnow(t);
  camTick(t);
  if (st.shopVisible && fxc) { liveTick(t); drawFX(t, dt); if (A.on && t > A.nextCrackle) { SFX.crackle(); A.nextCrackle = t + 120 + Math.random() * 500; } }
