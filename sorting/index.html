<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Sorting Ceremony</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07060a">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;0,700;1,400;1,500;1,600&family=Marck+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/core.css">
<style>
#castle{touch-action:none}
#stS{white-space:pre-line}
#hall{opacity:0}
#hall .pl svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#hallDim{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s;background:radial-gradient(70vmax 60vmax at 50% var(--hy,40%),rgba(4,4,10,.28),rgba(4,4,10,.74))}
#hallDim.in{opacity:1}
@media (min-width:768px){#hallDim{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}}
#hat{position:absolute;left:50%;pointer-events:none;opacity:0;transition:opacity .9s;filter:drop-shadow(0 16px 22px rgba(0,0,0,.7));animation:hatFloat 4.6s ease-in-out infinite alternate}
#hat.in{opacity:1}
#hat.none{display:none}
@keyframes hatFloat{from{transform:translateY(-7px) rotate(-.8deg)}to{transform:translateY(7px) rotate(.8deg)}}
#hat svg{width:100%;height:100%;display:block;overflow:visible}
#hatTip,#hatMouth{transform-box:fill-box}
#hatTip{transform-origin:18% 100%;animation:hatSway 5s ease-in-out infinite alternate}
#hatMouth{transform-origin:50% 40%}
#hat.talk #hatMouth{animation:hatTalk .24s ease-in-out infinite alternate}
#hat.talk #hatBrows{transform:translateY(-3px)}
@keyframes hatSway{from{transform:rotate(-2.5deg)}to{transform:rotate(3deg)}}
@keyframes hatTalk{from{transform:scaleY(.55)}to{transform:scaleY(1.55)}}
@media (prefers-reduced-motion:reduce){#hat,#hatTip,#hat.talk #hatMouth{animation:none}}
#nBtns .btn{font-size:16px;line-height:1.2;padding:9px 14px;border-radius:16px}
.house{font-weight:700;letter-spacing:.04em}
</style>
</head>
<body>
<div id="app">
  <section id="castle" class="scene">
    <div class="pl" id="caSky" data-d=".12"><svg id="svgCaSky" preserveAspectRatio="none"></svg></div>
    <canvas id="snowBack" class="full"></canvas>
    <div class="pl" id="caFar" data-d=".35"><svg id="svgCaFar" preserveAspectRatio="none"></svg></div>
    <div class="pl" id="caMain" data-d=".7"><svg id="svgCaMain" preserveAspectRatio="none"></svg></div>
    <div class="pl" id="caFg" data-d="1.05"><svg id="svgCaFg" preserveAspectRatio="none"></svg></div>
    <canvas id="snowFront" class="full"></canvas>
    <div class="st-title" id="stTitle"><h1 id="stT"></h1><p id="stS"></p></div>
    <button id="cta" type="button"></button>
    <p class="st-fan" id="stFan"></p>
  </section>

  <section id="hall" class="scene" hidden>
    <div class="pl" id="haBack" data-d=".2"><svg id="svgHaBack" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMin slice"></svg></div>
    <div class="pl" id="haMid" data-d=".7"><svg id="svgHaMid" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMin slice"></svg></div>
    <div class="pl" id="haFront" data-d="1.05"><svg id="svgHaFront" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMin slice"></svg></div>
    <div id="hallDim"></div>
    <div id="hat" aria-hidden="true"></div>
  </section>

  <div id="flash"></div>

  <div id="note" role="status" aria-live="polite"><div class="note-in" id="noteIn">
    <canvas id="noteBg" aria-hidden="true"></canvas>
    <div class="kicker" id="nKicker"></div>
    <div class="nspec" id="nSpec"></div>
    <div class="hand" id="nHand"></div>
    <div class="instr" id="nInstr"></div>
    <div class="status" id="nStatus"></div>
    <div class="nbtns" id="nBtns"></div>
  </div></div>

  <div class="topbar"><div id="lang" role="group" aria-label="Language"><button data-l="ua">UA</button><button data-l="en">EN</button></div><button id="snd" aria-label="Sound"></button></div>
</div>
<script src="/logic.js"></script>
<script src="/core.js"></script>
<script src="/sorting-logic.js"></script>
<script src="/sorting-questions.js"></script>
<script src="/hall.js"></script>
</body>
</html>
