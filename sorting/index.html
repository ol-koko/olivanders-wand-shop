<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Sorting Ceremony: which Hogwarts house are you?</title>
<meta name="description" content="Walk into the Great Hall, answer the Sorting Hat and find out which Hogwarts house is yours. An unofficial fan project.">

<link rel="canonical" href="https://olivanders-wand-shop.vercel.app/sorting">

<meta property="og:site_name" content="Ollivanders">

<meta property="og:description" content="Walk into the Great Hall and let the Sorting Hat decide.">
<meta property="og:image" content="https://olivanders-wand-shop.vercel.app/og-sorting.jpg">
<meta property="og:image:width" content="2400">
<meta property="og:image:height" content="1260">
<meta property="og:image:alt" content="Hogwarts castle at night on a snowy cliff, its Great Hall windows lit.">
<meta property="og:locale" content="en_US">
<meta property="og:locale:alternate" content="uk_UA">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Which Hogwarts house are you?">
<meta name="twitter:description" content="Walk into the Great Hall and let the Sorting Hat decide.">
<meta name="twitter:image" content="https://olivanders-wand-shop.vercel.app/og-sorting.jpg">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;0,700;1,400;1,500;1,600&family=Marck+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/core.css">
<style>
#castle{touch-action:none}
#stS{white-space:pre-line}
#hall{opacity:0}
#hall .pl svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#hallDim{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s;background:radial-gradient(70vmax 60vmax at 50% var(--hy,40%),rgba(4,4,10,.28),rgba(4,4,10,.74))}
#hallDim.in{opacity:1}
@media (min-width:768px){#hallDim{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}}
#hat{position:absolute;left:50%;pointer-events:none;opacity:0;transition:opacity .9s;filter:drop-shadow(0 16px 22px rgba(0,0,0,.7));animation:hatFloat 4.6s ease-in-out infinite alternate}
#hat.in{opacity:1}
#hat.none{display:none}
@keyframes hatFloat{from{transform:translateY(-7px) rotate(-.8deg) scale(1)}to{transform:translateY(7px) rotate(.8deg) scale(1.016)}}
#hat{transition:opacity .9s,rotate .5s cubic-bezier(.3,.7,.3,1),filter .9s}
#hat.crowned{filter:drop-shadow(0 0 22px rgba(255,205,120,.6))}
#hat3d{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .5s;background:radial-gradient(closest-side,rgba(255,217,160,.38),rgba(255,201,138,.13) 58%,rgba(255,201,138,0))}
#hat svg{transition:opacity .5s}#hat:not(.in) svg,#hat:not(.in) #hat3d{transition:none}
#hat.d3 #hat3d{opacity:1}#hat.d3 svg{opacity:0}
#hat.d3,#hat.d3.crowned{filter:none}
#hat.ponder #browL{transform:translateY(4px) rotate(11deg)}#hat.ponder #browR{transform:translateY(4px) rotate(-11deg)}
#hat.crowned .brow{transform:translateY(-6px)}
#hatTip{transition:rotate .7s cubic-bezier(.3,.7,.3,1)}
#hat.ponder #hatTip{rotate:-10deg}
#hat.crowned #hatTip{rotate:6deg}
#hatCrests{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
#hatCrests.on{opacity:1}
#hatCrests .crest{position:absolute;left:0;top:0;opacity:.16;transform:scale(.88);transition:opacity .16s,transform .16s}
#hatCrests .crest.lit{opacity:1;transform:scale(1.06);filter:drop-shadow(0 0 12px rgba(255,205,120,.85))}
#hatCrests svg{width:100%;height:auto;display:block}
#hatAura{position:absolute;left:50%;pointer-events:none;opacity:0;transform:scale(.55);transition:opacity 1s ease,transform 1.3s cubic-bezier(.2,.8,.2,1)}
#hatAura.on{opacity:1;transform:scale(1)}
#hatAura .glow{position:absolute;inset:0;border-radius:50%}
#hatAura .glow{background:radial-gradient(closest-side,rgba(255,221,150,.72),rgba(217,180,106,.36) 42%,rgba(217,180,106,0) 72%)}
#dustBack,#dustFront{position:absolute;pointer-events:none;opacity:0;transition:opacity .7s}
#dustBack.on,#dustFront.on{opacity:1}
@media (prefers-reduced-motion:reduce){#hatAura{transform:none}}
#hatWait{position:absolute;left:50%;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(closest-side,rgba(255,221,150,.44),rgba(217,180,106,.18) 45%,rgba(217,180,106,0) 72%)}
#hatWait.on{opacity:1;transition:opacity .6s .3s;animation:hatWait 1.6s ease-in-out infinite alternate}
@keyframes hatWait{from{transform:scale(.82);filter:brightness(.8)}to{transform:scale(1);filter:brightness(1.25)}}
@media (prefers-reduced-motion:reduce){#hatWait.on{animation:none}}
#hat svg{width:100%;height:100%;display:block;overflow:visible}
#hatTip,#hatMouth,.eye,.brow,.spirit{transform-box:fill-box}
#hatTip{transform-origin:18% 100%;animation:hatSway 5s ease-in-out infinite alternate}
#hatMouth{transform-origin:50% 30%;transform:scaleY(.32)}
.eye{transform-origin:50% 50%;transition:transform .07s}
#hat.blink .eye{transform:scaleY(.08)}
.brow{transition:transform .25s}
#browL{transform-origin:100% 100%}#browR{transform-origin:0 100%}
#hat.raise .brow{transform:translateY(-6px)}
#hat.furrow #browL{transform:translateY(3px) rotate(9deg)}#hat.furrow #browR{transform:translateY(3px) rotate(-9deg)}
.spirit{animation:ghostDrift 9s ease-in-out infinite alternate;opacity:.8}
.spirit.g2{animation-duration:11s;animation-delay:-4s}.spirit.g3{animation-duration:13s;animation-delay:-7s}.spirit.g4{animation-duration:10s;animation-delay:-2s}
@keyframes ghostDrift{from{transform:translate(-22px,6px)}to{transform:translate(26px,-10px)}}
@keyframes hatSway{from{transform:rotate(-2.5deg)}to{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){#hat,#hatTip,.spirit{animation:none}#hat{transition:opacity .9s}}
#nBtns .btn{font-size:16px;line-height:1.2;padding:9px 14px;border-radius:16px}
#hall,#note{touch-action:pinch-zoom}
#nBtns .btn.aim{border-color:#b07c38;background:rgba(176,124,56,.26);box-shadow:0 0 18px rgba(255,190,100,.6)}
@media (prefers-reduced-motion:no-preference){#nBtns .btn.aim{transform:scale(1.04)}}
#nBtns.wish{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
#nBtns .ban{display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:2px solid transparent;color:#2a170b;padding:3px 0;font-size:14px;border-radius:10px}
#nBtns .ban svg{height:70px;width:auto;filter:drop-shadow(0 2px 3px rgba(40,20,5,.45))}
#nBtns .ban.want{border-color:#b07c38;background:rgba(176,124,56,.2)}
#nBtns .ban.nope svg{opacity:.3;filter:grayscale(1)}
#nBtns .ban.nope span{text-decoration:line-through}
#nBtns .wide{grid-column:1/-1}
@media (max-width:360px){#nBtns .ban{font-size:11.5px}#nBtns .ban svg{height:50px}#nBtns.wish{gap:3px}}
@media (max-height:480px){#nBtns .ban svg{height:30px}#nBtns .wide{grid-column:span 2}#nBtns .btn{padding:6px 10px;font-size:15px}.hand{font-size:22px}}
/* answering with the head: the answer pointed at gets the usual highlight; the timer lives in the mirror, the shop's portrait frame (ring filling, hourglass pouring over the picture) */
#nBtns .btn,#nBtns .ban{position:relative}
#headMirror{position:fixed;z-index:30;top:calc(env(safe-area-inset-top) + 10px);left:calc(env(safe-area-inset-left) + 10px);width:clamp(96px,min(36vw,17vh),170px);aspect-ratio:4/5;pointer-events:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.65));transition:filter .4s}
@media (min-width:900px) and (min-height:700px){#headMirror{width:clamp(150px,24vh,230px)}}
#headMirror.seen{filter:drop-shadow(0 8px 14px rgba(0,0,0,.65)) drop-shadow(0 0 12px rgba(255,200,110,.7))}
#headMirror .ring{position:absolute;z-index:1;left:50%;top:50%;width:90%;aspect-ratio:1;translate:-50% -50%;transform:rotate(-90deg);overflow:visible}
#headMirror .ring circle{fill:none;stroke:#f6d27e;stroke-width:4.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--f,0));opacity:0;filter:drop-shadow(0 0 3px rgba(255,200,110,.95));transition:opacity .15s}
#headMirror.hold .ring circle{opacity:1}
#headMirror .hglass{position:absolute;z-index:1;left:50%;top:50%;width:44%;aspect-ratio:2/3;translate:-50% -50%;opacity:0;transition:opacity .15s;filter:drop-shadow(0 0 4px rgba(0,0,0,.75))}
#headMirror.hold .hglass{opacity:.9}
#headMirror .sand{fill:#ecc46a;transform-box:fill-box;transform-origin:50% 100%}
#headMirror .top{transform:scaleY(calc(1 - var(--f,0)))}#headMirror .bot{transform:scaleY(var(--f,0))}
#headMirror .fall{stroke:#ecc46a;stroke-width:1.3;stroke-dasharray:1.6 1.4;animation:hgPour .35s linear infinite}
@keyframes hgPour{to{stroke-dashoffset:-3}}
/* reading: a calm full ring and a still hourglass, nothing can be picked. The end of a hold: 3-2-1 over the picture and a glow on the answer */
#headMirror{container-type:inline-size}
#note.head #nInstr{font-variant-numeric:lining-nums}
#headMirror.read .ring circle{opacity:.4;stroke-dashoffset:0;stroke-width:2.6;filter:none}
#headMirror.read .hglass{opacity:.55}
#headMirror.read .fall{display:none}
#headMirror .count{position:absolute;z-index:2;inset:0;display:grid;place-items:center;font:700 56px/1 var(--serif,'Cormorant Garamond',serif);font-size:44cqw;font-variant-numeric:lining-nums;color:#ffe9b0;text-shadow:0 2px 6px rgba(0,0,0,.95),0 0 16px rgba(255,190,90,.85);opacity:0;transition:opacity .15s}
#headMirror.count .count{opacity:1}
#headMirror.count .hglass{opacity:0}
#nBtns .soon{box-shadow:0 0 0 3px rgba(217,180,106,.95),0 0 24px rgba(255,190,100,.85)}
@keyframes hgCalm{from{opacity:.26}to{opacity:.5}}
@keyframes hgSoon{50%{box-shadow:0 0 0 3px rgba(217,180,106,.55),0 0 12px rgba(255,190,100,.5)}}
@media (prefers-reduced-motion:no-preference){#headMirror.read .ring circle{animation:hgCalm 1.6s ease-in-out infinite alternate}#nBtns .soon{animation:hgSoon 1s ease-in-out infinite}}
@media (prefers-reduced-motion:reduce){#headMirror .hglass{display:none}#headMirror .ring circle{transition:none}}
/* the back arrow after an answer picked by the head: on the scroll's top right corner, tap and keyboard only */
#headBack{position:absolute;z-index:2;right:12px;top:19px;width:36px;height:36px;border-radius:50%;border:1.5px solid #8a6a3a;background:rgba(244,231,198,.9);color:#3a2516;display:grid;place-items:center;cursor:pointer;pointer-events:auto;padding:0;box-shadow:0 2px 6px rgba(40,20,5,.35)}
#headBack[hidden]{display:none}
#headBack svg{width:20px;height:20px}
#headBack::before{content:'';position:absolute;inset:-6px}
#headBack:focus-visible{outline:3px solid #d9b46a;outline-offset:2px}
/* TEMPORARY: ?debug=head readout, removed before merge */
#headDbg{position:fixed;z-index:60;left:8px;top:8px;max-width:70vw;padding:6px 9px;border-radius:8px;background:rgba(0,0,0,.78);color:#9f9;font:12px/1.35 ui-monospace,Menlo,monospace;white-space:pre;pointer-events:none}
#nBtns .btn.tapLink{grid-column:1/-1;justify-self:center;background:none;border:0;box-shadow:none;color:#7a5428;font-size:15px;padding:4px 6px;text-decoration:underline;text-underline-offset:3px}
#rSeal{position:relative;margin:clamp(6px,1.4vh,14px) auto 0;height:clamp(150px,calc(150px + (var(--h) - 568px)*.22),230px);aspect-ratio:240/300;opacity:0;transform-origin:50% 92%}
#rSeal{perspective:900px;touch-action:none;cursor:grab}
#rSeal:active{cursor:grabbing}
#rSeal .coin{position:relative;width:100%;height:100%;transform-style:preserve-3d}
#rSeal .face{position:absolute;inset:0;width:100%;height:100%;display:block;backface-visibility:hidden;-webkit-backface-visibility:hidden}
#rSeal .front svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 16px rgba(0,0,0,.65))}
#rSeal .edge{filter:brightness(.42) sepia(.4);backface-visibility:visible;-webkit-backface-visibility:visible}
#rSeal .back{transform:rotateY(180deg) translateZ(9px);filter:brightness(.62) sepia(.35)}
#rSeal.stamp{animation:stamp .72s cubic-bezier(.55,0,.8,.3) both}
@keyframes stamp{0%{opacity:0;transform:translateY(-80px) scale(1.9)}58%{opacity:1;transform:translateY(0) scale(1.03)}68%{transform:scale(1.1,.86)}82%{transform:scale(.97,1.04)}100%{opacity:1;transform:none}}
#rSeal.fade{animation:sealFade .6s ease-out both}
@keyframes sealFade{from{opacity:0}to{opacity:1}}
.rcard.thud{animation:cardThud .34s ease-out}
@keyframes cardThud{25%{translate:0 3px}50%{translate:-2px -1px}75%{translate:1px 1px}100%{translate:0 0}}
#rSeal .shine{animation:shine 5.4s ease-in-out 1.4s infinite}
@keyframes shine{0%{transform:translateX(0) skewX(-18deg)}24%,100%{transform:translateX(470px) skewX(-18deg)}}
@media (prefers-reduced-motion:reduce){#rSeal .shine{animation:none;display:none}}
#rSpecs{text-transform:none}
#rToShop{display:inline-block;margin-top:10px;font-size:15px;color:#e8c27a;text-decoration:none;border-radius:4px}
#rToShop:hover,#rToShop:focus-visible{text-decoration:underline;text-underline-offset:3px}
#rToShop:focus-visible{outline:2px solid #e8c27a;outline-offset:4px}
.house{font-weight:700;letter-spacing:.04em}
</style>
</head>
<body>
<div id="app">
  <section id="castle" class="scene">
    <div class="pl" id="caSky" data-d=".12"><svg id="svgCaSky" preserveAspectRatio="none"></svg></div>
    <canvas id="snowBack" class="full"></canvas>
    <div class="pl" id="caFar" data-d=".35"><svg id="svgCaFar" preserveAspectRatio="none"></svg></div>
    <div class="pl" id="caMain" data-d=".7"><svg id="svgCaMain" preserveAspectRatio="none"></svg></div>
    <div class="pl" id="caFg" data-d="1.05"><svg id="svgCaFg" preserveAspectRatio="none"></svg></div>
    <canvas id="snowFront" class="full"></canvas>
    <div class="st-title" id="stTitle"><h1 id="stT"></h1><p id="stS"></p></div>
    <button id="cta" type="button"></button>
    <p class="st-fan" id="stFan"></p>
  </section>

  <section id="hall" class="scene" hidden>
    <div class="pl" id="haBack" data-d=".2"><svg id="svgHaBack" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMin slice"></svg></div>
    <div class="pl" id="haMid" data-d=".7"><svg id="svgHaMid" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMin slice"></svg></div>
    <div class="pl" id="haFront" data-d="1.05"><svg id="svgHaFront" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMin slice"></svg></div>
    <div id="hallDim"></div>
    <div id="hatAura" aria-hidden="true"></div>
    <div id="hatWait" aria-hidden="true"></div>
    <div id="hatCrests" aria-hidden="true"></div>
    <canvas id="dustBack" aria-hidden="true"></canvas>
    <div id="hat" aria-hidden="true"></div>
    <canvas id="dustFront" aria-hidden="true"></canvas>
  </section>

  <div id="flash"></div>

  <div id="note" role="status" aria-live="polite"><button id="headBack" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 5.5 4 12l6.5 6.5M4.5 12H20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="note-in" id="noteIn">
    <canvas id="noteBg" aria-hidden="true"></canvas>
    <div class="kicker" id="nKicker"></div>
    <div class="nspec" id="nSpec"></div>
    <div class="hand" id="nHand"></div>
    <div class="instr" id="nInstr"></div>
    <div class="status" id="nStatus"></div>
    <div class="nbtns" id="nBtns"></div>
  </div></div>

  <div id="result" hidden><div class="rcard">
    <div class="r-kicker" id="rKicker"></div>
    <h1 id="rName"></h1>
    <div class="r-specs" id="rSpecs" hidden></div>
    <div id="rSeal" aria-hidden="true"></div>
    <p class="r-lore" id="rLore"></p>
    <div class="r-btns">
      <button class="pri" id="bShare" hidden></button>
      <button class="pri" id="bDown" hidden></button>
      <button id="bAgain"></button>
    </div>
    <a id="rToShop" href="/" hidden></a><br>
    <a class="r-credit" id="rCredit" href="https://oleksandra-kokozei.com" target="_blank" rel="noopener">made by Oleksandra Kokozei 🪄</a>
    <div id="rSaved" hidden><img id="rSavedImg" alt=""><p class="cap" id="rSavedCap"></p></div>
  </div></div>

  <div id="headMirror" hidden aria-hidden="true"><div class="cam-view"><video id="headCam" playsinline muted></video></div></div>
  <div class="topbar"><div id="lang" role="group" aria-label="Language"><button data-l="ua">UA</button><button data-l="en">EN</button></div><button id="snd" aria-label="Sound"></button></div>
</div>
<script src="/logic.js"></script>
<script src="/core.js"></script>
<script src="/sorting-logic.js"></script>
<script src="/sorting-questions.js"></script>
<script src="/crests.js"></script>
<script src="/hat3d.js"></script>
<script src="/head-logic.js"></script>
<script src="/hall.js"></script>
<script src="/head.js"></script>
</body>
</html>
